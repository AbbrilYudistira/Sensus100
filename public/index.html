<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SENSUS 100</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bps-navy: #0b2545;
            --bps-blue: #1565c0;
            --bps-blue-light: #2f8fe0;
            --bps-green: #1f9d55;
            --bps-green-light: #4cc179;
            --bps-orange: #f5921e;
            --bps-orange-light: #ffb454;
            --bps-white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 12% 15%, rgba(47, 143, 224, 0.35), transparent 45%),
                radial-gradient(circle at 88% 80%, rgba(31, 157, 85, 0.25), transparent 50%),
                linear-gradient(160deg, var(--bps-navy) 0%, var(--bps-blue) 100%);
            color: var(--bps-white);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0;
            padding: 28px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(12px, 2vh, 28px);
            justify-content: center;
        }

        .header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            color: var(--bps-white);
            font-size: 3.1em;
            letter-spacing: 2px;
            margin: 0;
            position: relative;
            padding-bottom: 14px;
            font-size: clamp(1.8em, 4vw, 3.1em);
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 6px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--bps-orange), var(--bps-green-light));
        }

        .question-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 2.1em;
            margin: 6px auto 26px auto;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 22px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            width: 82%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            font-size: clamp(1.1em, 2.2vw, 2.1em);
            padding: clamp(12px, 2vh, 22px) 30px;
            margin: clamp(4px, 1vh, 6px) auto clamp(14px, 2vh, 26px) auto;
        }

        .board {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            width: 82%;
            max-width: 920px;
            margin: 0 auto;
            gap: clamp(8px, 1.4vh, 14px);
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 1.5vw, 20px);
            margin: clamp(10px, 1.5vh, 20px) 0;
        }

        .score-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: clamp(8px, 1vw, 14px);
        }

        .score-box {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: clamp(1.2em, 2.5vw, 2.6em);
            background: linear-gradient(145deg, var(--bps-navy), #071a33);
            border: 2px solid var(--bps-orange);
            border-radius: 14px;
            padding: clamp(6px, 1vh, 10px) clamp(14px, 2vw, 26px);
            min-width: clamp(50px, 6vw, 80px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
        }

        .score-box.total {
            border-color: var(--bps-green-light);
            background: linear-gradient(145deg, var(--bps-green), var(--bps-green-light));
        }

        .strike-marks {
            font-size: clamp(0.9em, 1.6vw, 1.6em);
            letter-spacing: clamp(1px, 0.4vw, 4px);
            margin-top: 0;
        }

        .answer-box {
            height: 78px;
            background: linear-gradient(135deg, var(--bps-blue) 0%, var(--bps-navy) 100%);
            border: none;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px 0 78px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.7em;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            transition: background 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.5s ease;
            height: clamp(54px, 9vh, 78px);
            font-size: clamp(1.05em, 1.8vw, 1.7em);
        }

        .answer-box .text { visibility: hidden; opacity: 0; transition: opacity 0.4s ease 0.15s; }
        .answer-box .points {
            visibility: hidden;
            opacity: 0;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 22px;
            border-radius: 10px;
            border: 2px solid var(--bps-white);
            font-family: 'Poppins', sans-serif;
            transition: opacity 0.4s ease 0.15s;
        }

        .answer-box.revealed {
            background: linear-gradient(135deg, var(--bps-green-light) 0%, var(--bps-green) 100%);
            transform: scale(1.02);
            box-shadow: 0 10px 26px rgba(31, 157, 85, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .answer-box.revealed .text,
        .answer-box.revealed .points {
            visibility: visible;
            opacity: 1;
            color: var(--bps-white);
        }

        .answer-box::after {
            content: attr(data-index);
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            background: linear-gradient(145deg, var(--bps-orange-light), var(--bps-orange));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bps-navy);
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 0.95em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        .answer-box.revealed::after {
            background: linear-gradient(145deg, var(--bps-white), #e2e8f0);
            color: var(--bps-green);
        }

        #x-mark {
            position: fixed;
            top: 62%; /* Diturunkan ke bawah agar tidak menutupi pertanyaan (sebelumnya 50%) */
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: clamp(280px, 84vmin, 540px); 
            display: none;
            z-index: 100;
            filter: drop-shadow(0 20px 40px rgba(220, 20, 20, 0.6));
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .muncul-animasi {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header-logo"><h1>STUDENT 100</h1></div>
    <div id="question" class="question-text">Memuat pertanyaan...</div>
    <div id="board" class="board"></div>
    <div class="scoreboard">
        <div class="score-group">
            <div class="strike-marks" id="strike-a"></div>
            <div class="score-box" id="score-a">0</div>
        </div>
        <div class="score-box total" id="score-total">0</div>
        <div class="score-group">
            <div class="score-box" id="score-b">0</div>
            <div class="strike-marks" id="strike-b"></div>
        </div>
    </div>
    <div id="strike-marks" class="strike-marks"></div>
    <img id="x-mark" src="/pop up salah.png" alt="Salah">

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Menangkap klik pertama untuk membuka kunci audio browser
        document.body.addEventListener('click', function() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // Memutar suara senyap selama 1 milidetik sebagai pancingan
            const silentOsc = audioCtx.createOscillator();
            silentOsc.connect(audioCtx.destination);
            silentOsc.start();
            silentOsc.stop(audioCtx.currentTime + 0.001);
            console.log("Sistem Audio Berhasil Dibuka!");
        }, { once: true });
            // 1. Definisikan file audio di LUAR fungsi (Global Scope)
            const audioBenar = new Audio('/benar.mp3');
            const audioSalah = new Audio('/tetot.mp3');

            // 2. Menangkap klik pertama di layar proyektor
            document.body.addEventListener('click', function() {
                // Putar senyap sebentar untuk buka akses browser
                audioBenar.play().then(() => audioBenar.pause()).catch(e => console.log(e));
                audioSalah.play().then(() => audioSalah.pause()).catch(e => console.log(e));
                console.log("Akses Audio MP3 Terbuka!");
            }, { once: true });

            // 3. Fungsi utama yang akan dipanggil oleh Socket.io dari Admin
            function playSound(type) {
                if (type === 'correct') {
                    audioBenar.currentTime = 0; // Reset ke awal
                    audioBenar.play().catch(e => console.error("Gagal putar MP3 benar:", e));
                } else if (type === 'wrong') {
                    audioSalah.currentTime = 0; // Reset ke awal
                    audioSalah.play().catch(e => console.error("Gagal putar MP3 salah:", e));
                }
            }
        socket.on('play_sound', (type) => playSound(type));
        socket.on('state_update', (data) => {
            document.getElementById('question').innerText = data.question.question;
            const board = document.getElementById('board'); board.innerHTML = '';
            data.question.answers.forEach((ans, i) => {
                const isRevealed = data.revealed.includes(i);
                const box = document.createElement('div');
                box.className = 'answer-box ' + (isRevealed ? 'revealed' : 'hidden');
                box.setAttribute('data-index', i + 1);
                box.innerHTML = `<span class="text">${ans.text}</span><span class="points">${ans.points}</span>`;
                board.appendChild(box);
            });

            // BARU: update skor & strike
            document.getElementById('score-a').innerText = data.scoreA;
            document.getElementById('score-b').innerText = data.scoreB;
            document.getElementById('score-total').innerText = data.scoreA + data.scoreB;
            document.getElementById('strike-a').innerHTML = '❌'.repeat(data.wrongA);
            document.getElementById('strike-b').innerHTML = '❌'.repeat(data.wrongB);
        });
        socket.on('show_x_screen', () => {
            const xMark = document.getElementById('x-mark');
            xMark.style.display = 'block';
            
            // Trik mereset animasi agar bisa berulang berkali-kali
            xMark.classList.remove('muncul-animasi');
            void xMark.offsetWidth; // Memaksa browser membaca ulang elemen
            xMark.classList.add('muncul-animasi');
            
            setTimeout(() => { 
                xMark.style.display = 'none'; 
                xMark.classList.remove('muncul-animasi');
            }, 3000);
        });
    </script>
</body>
</html>
